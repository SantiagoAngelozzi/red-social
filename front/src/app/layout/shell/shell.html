<div class="shell">
  <aside class="lateral">
    <a routerLink="/publicaciones" class="lateral-logo" aria-label="Ir a publicaciones">
      <app-logo />
    </a>

    <nav class="nav" aria-label="Navegación principal">
      <a routerLink="/publicaciones" routerLinkActive="activo" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z" />
        </svg>
        <span>Publicaciones</span>
      </a>
      <a routerLink="/mi-perfil" routerLinkActive="activo" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c1.5-4.5 4.5-7 8-7s6.5 2.5 8 7" />
        </svg>
        <span>Mi perfil</span>
      </a>
      <a *appSoloAdmin routerLink="/usuarios" routerLinkActive="activo" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5" />
          <path d="M2.5 20c1.2-3.6 3.6-5.5 6.5-5.5s5.3 1.9 6.5 5.5" />
          <circle cx="17" cy="9" r="2.5" />
          <path d="M16 14.6c2.6.2 4.4 1.9 5.5 5.4" />
        </svg>
        <span>Usuarios</span>
      </a>
      <a *appSoloAdmin routerLink="/estadisticas" routerLinkActive="activo" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
        </svg>
        <span>Estadísticas</span>
      </a>
    </nav>

    @if (sesion.usuario(); as usuario) {
      <div class="jugador">
        <div class="avatar">
          @if (usuario.imagenPerfil) {
            <img appImagenRespaldo [src]="usuario.imagenPerfil" [alt]="'Foto de ' + usuario.nombreUsuario" />
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c1.5-4.5 4.5-7 8-7s6.5 2.5 8 7" />
            </svg>
          }
        </div>
        <div class="jugador-datos">
          <span class="jugador-nombre">{{ usuario.nombre }} {{ usuario.apellido }}</span>
          <span class="jugador-usuario">&#64;{{ usuario.nombreUsuario }}</span>
        </div>
        <button type="button" class="salir" (click)="cerrarSesion()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10" />
          </svg>
        </button>
      </div>
    }
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
<app-aviso-sesion />
