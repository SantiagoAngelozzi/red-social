<main class="login">
  <!-- Lado izquierdo: la cancha -->
  <section class="cancha" aria-hidden="true">
    <div class="cancha-luces"></div>
    <div class="cancha-piso"></div>

    <div class="cancha-contenido">
      <app-logo [tamanio]="'grande'" />
      <p class="lema">
        <span class="lema-azul">Jugá.</span>
        <span>Compartí.</span>
        <span class="lema-naranja">Conectá.</span>
      </p>
      <p class="bajada">La red social de la comunidad de Rocket League.</p>
    </div>

    <!-- Pelota con estela de boost -->
    <div class="pelota-zona">
      <div class="estela"></div>
      <svg class="pelota" viewBox="0 0 100 100">
        <defs>
          <radialGradient id="brilloPelota" cx="35%" cy="30%" r="70%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.6" stop-color="#cfd9ee" />
            <stop offset="1" stop-color="#7d8db3" />
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="url(#brilloPelota)" stroke="#0a1430" stroke-width="4" />
        <path d="M50 22 L66 34 L60 54 L40 54 L34 34 Z" fill="#26397a" />
        <path d="M50 22 L50 6 M66 34 L84 28 M60 54 L72 72 M40 54 L28 72 M34 34 L16 28" stroke="#26397a" stroke-width="4" />
        <circle cx="50" cy="38" r="6" fill="#ffd23f" />
      </svg>
    </div>
  </section>

  <!-- Lado derecho: formulario (por ahora solo visual) -->
  <section class="panel">
    <div class="tarjeta">
      <div class="tarjeta-logo-movil">
        <app-logo />
      </div>

      <h1 class="titulo">Entrá a la cancha</h1>
      <p class="subtitulo">Iniciá sesión con tu correo o tu nombre de usuario.</p>

      <div class="formulario">
        <!-- Correo o usuario -->
        <div class="campo">
          <label class="campo-label" for="identificador">Correo o nombre de usuario</label>
          <div class="campo-caja">
            <svg class="campo-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round" />
            </svg>
            <input id="identificador" class="campo-input" type="text" placeholder="vos@correo.com o tu_usuario" />
          </div>
        </div>

        <!-- Contraseña -->
        <div class="campo">
          <label class="campo-label" for="password">Contraseña</label>
          <div class="campo-caja">
            <svg class="campo-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" />
              <path d="M8 11V8a4 4 0 0 1 8 0v3" />
            </svg>
            <input id="password" class="campo-input" type="password" placeholder="Tu contraseña" />
          </div>

          <!-- Medidor de boost (por ahora vacío, sin lógica) -->
          <div class="boost">
            <div class="boost-cabecera">
              <span>Boost de la contraseña</span>
              <span class="boost-numero">0</span>
            </div>
            <div class="boost-barra">
              <div class="boost-relleno" style="width: 0%"></div>
            </div>
            <ul class="reglas">
              <li>8 caracteres o más</li>
              <li>Una mayúscula</li>
              <li>Un número</li>
            </ul>
          </div>
        </div>

        <!-- Por ahora solo navega a publicaciones -->
        <a routerLink="/publicaciones" class="btn btn-naranja btn-enviar">
          <span>Iniciar sesión</span>
        </a>
      </div>

      <p class="registro">
        ¿Todavía no tenés cuenta?
        <a routerLink="/registro">Registrate</a>
      </p>
    </div>
  </section>
</main>
