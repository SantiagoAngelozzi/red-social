<div class="feed">
  <header>
    <h1 class="feed-titulo">Publicaciones</h1>
    <p class="feed-bajada">Lo último de la comunidad.</p>
  </header>

  <div class="crear">
    <div class="crear-fila">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4.5 4.5-7 8-7s6.5 2.5 8 7" /></svg>
      </div>
      <div class="crear-campos">
        <input class="campo-input input-titulo" placeholder="Título de tu publicación" aria-label="Título" />
        <textarea class="campo-input" rows="3" placeholder="¿Qué jugada querés contar?" aria-label="Mensaje"></textarea>
      </div>
    </div>
    <div class="crear-acciones">
      <span class="adjuntar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <circle cx="9" cy="10" r="2" />
          <path d="m21 16-5-5-9 9" />
        </svg>
        Agregar imagen
      </span>
      <button type="button" class="btn btn-chico">
        <span>Publicar</span>
      </button>
    </div>
  </div>

  <div class="orden" role="tablist" aria-label="Ordenar publicaciones">
    <button
      type="button"
      role="tab"
      class="orden-tab"
      [class.activo]="orden() === 'fecha'"
      [attr.aria-selected]="orden() === 'fecha'"
      (click)="cambiarOrden('fecha')"
    >
      Más recientes
    </button>
    <button
      type="button"
      role="tab"
      class="orden-tab orden-naranja"
      [class.activo]="orden() === 'meGusta'"
      [attr.aria-selected]="orden() === 'meGusta'"
      (click)="cambiarOrden('meGusta')"
    >
      Más me gusta
    </button>
  </div>

  @if (error()) {
    <div class="aviso aviso-error" role="alert">{{ error() }}</div>
  }

  @if (cargando()) {
    <p class="estado">Cargando publicaciones...</p>
  } @else {
    <div class="lista">
      @for (publicacion of publicaciones(); track publicacion._id) {
        <app-publicacion-card [publicacion]="publicacion" [usuarioId]="sesion.usuario()?._id ?? null" />
      } @empty {
        @if (!error()) {
          <div class="vacio">
            <h2>La cancha está vacía</h2>
            <p>Todavía no hay publicaciones.</p>
          </div>
        }
      }
    </div>
  }
</div>
